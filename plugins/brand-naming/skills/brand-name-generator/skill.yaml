schema: 1
name: brand-name-generator
version: 0.1.0
title: "Генератор названий бренда"
description: "Проводит профессиональный процесс нейминга для бренда, продукта, проекта или репозитория: от стратегического брифа и смысловых территорий до нескольких волн вариантов, журнала фаворитов и итогового шорт-листа. Используй, когда нужно придумать, уточнить или сменить название."
compatible_agents:
  - claude
  - codex
  - cursor
  - opencode
  - openclaw
  - hermes
  - zcode
requires:
  mcp: []
  permissions:
    filesystem: write
